 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <title>{% block title %}CoursePortal{% endblock %}</title>
 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
 
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'catalog:home' %}">
                CoursePortal
            </a>
 
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'catalog:home' %}">Home</a>
                <a class="nav-link" href="{% url 'catalog:course_list' %}">Courses</a>
                <a class="nav-link" href="{% url 'catalog:inquiry' %}">Inquiry</a>
            </div>
        </div>
    </nav>
 
    <!-- Main Content -->
    <main class="container mt-4">
        {% block content %}
        {% endblock %}
    </main>
 
    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
